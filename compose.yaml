services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: book_reader
      POSTGRES_USER: book_reader
      POSTGRES_PASSWORD: book_reader
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U book_reader -d book_reader"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - protected_storage:/data/storage
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  protected_storage:

