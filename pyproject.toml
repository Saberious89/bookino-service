[project]
name = "protected-book-backend"
version = "0.1.0"
description = "Self-hosted API for the protected book reader"
requires-python = ">=3.12"
dependencies = [
  "alembic==1.19.1",
  "cryptography==46.0.7",
  "fastapi==0.141.1",
  "psycopg[binary]==3.3.4",
  "pwdlib[argon2]==0.3.1",
  "pyjwt[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "sqlalchemy==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.2",
  "pytest-cov==7.1.0",
  "ruff==0.16.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
